# PWA'daki "Başlat" düğmesi bunu tetikler (workflow_dispatch). Servis notebook'unu Kaggle'a gönderip çalıştırır.
# Repo secret'ı: KAGGLE_API_TOKEN (KAGGLE_USERNAME isteğe bağlı).
name: Kaggle servisini başlat
on:
  workflow_dispatch:
concurrency:
  group: kaggle-servis
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "kaggle>=1.8"
      - name: Servis notebook'unu gönder
        env:
          # Kullanıcı adı gizli değil; secret/değişken yoksa varsayılan kullanılır.
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME || vars.KAGGLE_USERNAME || 'hsnyld' }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: scripts/kaggle_push.sh kaggle/servis
